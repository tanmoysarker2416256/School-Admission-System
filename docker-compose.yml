services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: school_admission
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_admission"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=school_admission;Username=postgres;Password=postgres"
      HOLD_DURATION_SECONDS: "600"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    depends_on:
      - backend
    ports:
      - "3000:80"



  tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: build
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEST_DB_CONNECTION: "Host=db;Port=5432;Database=school_admission_test;Username=postgres;Password=postgres"
    command: dotnet test SchoolAdmission.Tests/SchoolAdmission.Tests.csproj

volumes:
  pgdata: